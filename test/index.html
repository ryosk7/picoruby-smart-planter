<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>soil_moisture.rb on PicoRuby.wasm</title>
<h1>soil_moisture.rb on PicoRuby.wasm</h1>
<p>結果は開発者ツールのコンソールに出ます。</p>
<script>
  // Run soil_moisture.rb unchanged, with ADC replaced by a stub that returns each voltage below.
  const VOLTAGES = [3.0, 2.6, 2.2, 1.85, 1.5, 1.1, 0.8];
  const STUB = `
module Kernel
  def require(name)
    true
  end
end
class ADC
  def initialize(pin)
    @pin = pin
  end
  def read_voltage
    $V
  end
  def read_raw
    ($V / 3.6 * 4095).to_i
  end
end
`;
  fetch("../soil_moisture.rb").then((r) => r.text()).then((code) => {
    for (const v of VOLTAGES) {
      const s = document.createElement("script");
      s.type = "text/ruby";
      s.textContent = `${STUB}\n$V = ${v}\nputs "--- volt=${v}"\n${code}`;
      document.body.appendChild(s);
    }
    const loader = document.createElement("script");
    loader.src = "https://cdn.jsdelivr.net/npm/@picoruby/wasm-wasi@4.0.5/dist/init.iife.js";
    document.body.appendChild(loader);
  });
</script>
</html>
