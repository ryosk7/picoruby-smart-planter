<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スマートプランター</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f3ee;
      --surface: #ffffff;
      --line: #dedad0;
      --text: #1d2420;
      --muted: #66706a;
      --dry: #b45309;
      --dry-soft: #fdf0dd;
      --ok: #2f7d4f;
      --ok-soft: #e3f3e8;
      --wet: #1d6fb8;
      --wet-soft: #e1eefa;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141816;
        --surface: #1d2320;
        --line: #333b37;
        --text: #e8ece9;
        --muted: #9aa49f;
        --dry: #f0a04b;
        --dry-soft: #3a2a17;
        --ok: #5cc28a;
        --ok-soft: #183526;
        --wet: #63a9ec;
        --wet-soft: #162c42;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { width: min(760px, 100%); margin: 0 auto; padding: 32px 16px 48px; }
    h1 { margin: 0; font-size: 1.6rem; }
    .lead { margin: 4px 0 24px; color: var(--muted); font-size: .9rem; }
    .notice { padding: 12px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
    .notice.error { color: var(--dry); border-color: var(--dry); }
    .card { margin-bottom: 20px; padding: 20px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 8px solid var(--line); }
    .card.dry { border-left-color: var(--dry); }
    .card.ok { border-left-color: var(--ok); }
    .card.wet { border-left-color: var(--wet); }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .device { font-weight: 600; }
    .updated { color: var(--muted); font-size: .85rem; }
    .now { display: flex; align-items: center; gap: 20px; margin: 12px 0 16px; flex-wrap: wrap; }
    .moisture { font-size: 4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .moisture small { font-size: 1.6rem; font-weight: 600; margin-left: 2px; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 700; }
    .badge.dry { color: var(--dry); background: var(--dry-soft); }
    .badge.ok { color: var(--ok); background: var(--ok-soft); }
    .badge.wet { color: var(--wet); background: var(--wet-soft); }
    .meta { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .chart { display: block; width: 100%; height: auto; }
    .chart-title { margin: 0 0 6px; font-size: .85rem; color: var(--muted); font-weight: 500; }
    footer { color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/ruby">
    # Ruby in the browser: Funicular 0.5.2 bundled in @picoruby/wasm-wasi 4.0.5.

    POLL_MS = 60_000
    DAY_MS = 24 * 60 * 60 * 1000
    STATUS_LABELS = { "dry" => "乾燥", "ok" => "ちょうどよい", "wet" => "湿りすぎ" }

    module Clock
      def self.now_ms
        JS.global[:Date].now.to_i
      end

      def self.parse_ms(iso)
        JS.global[:Date].parse(iso).to_i
      end

      def self.local(iso)
        JS.global[:Date].new(iso).toLocaleString("ja-JP")
      end
    end

    # Moisture over the last 24 hours, drawn as an SVG polyline in Ruby.
    # Funicular's virtual DOM creates HTML elements only, so the SVG is
    # handed to an <img> as a data URI.
    module MoistureChart
      W = 640
      H = 200
      LEFT = 36
      RIGHT = 8
      TOP = 10
      BOTTOM = 26

      def self.x_for(ms, start_ms)
        LEFT + (ms - start_ms) * (W - LEFT - RIGHT) / DAY_MS.to_f
      end

      def self.y_for(moisture)
        TOP + (100 - moisture) * (H - TOP - BOTTOM) / 100.0
      end

      def self.r1(v)
        (v * 10).round / 10.0
      end

      def self.svg(readings, now_ms)
        start_ms = now_ms - DAY_MS
        plot_w = W - LEFT - RIGHT
        out = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 #{W} #{H}' font-family='system-ui, sans-serif' font-size='11'>"
        # Bands for dry (< 30), ok (< 60) and wet.
        [[0, 30, "#b45309"], [30, 60, "#2f7d4f"], [60, 100, "#1d6fb8"]].each do |lo, hi, color|
          y = y_for(hi)
          out << "<rect x='#{LEFT}' y='#{r1(y)}' width='#{plot_w}' height='#{r1(y_for(lo) - y)}' fill='#{color}' fill-opacity='0.08'/>"
        end
        [0, 30, 60, 100].each do |v|
          y = r1(y_for(v))
          out << "<line x1='#{LEFT}' x2='#{W - RIGHT}' y1='#{y}' y2='#{y}' stroke='#8a948f' stroke-opacity='0.35'/>"
          out << "<text x='#{LEFT - 6}' y='#{r1(y + 4)}' text-anchor='end' fill='#8a948f'>#{v}</text>"
        end
        [[0, "24時間前"], [12, "12時間前"], [24, "いま"]].each do |hour, label|
          x = r1(LEFT + plot_w * hour / 24.0)
          anchor = hour == 0 ? "start" : (hour == 24 ? "end" : "middle")
          out << "<text x='#{x}' y='#{H - 8}' text-anchor='#{anchor}' fill='#8a948f'>#{label}</text>"
        end
        points = []
        readings.reverse.each do |r|
          ms = Clock.parse_ms(r["measured_at"])
          next if ms < start_ms
          points << "#{r1(x_for(ms, start_ms))},#{r1(y_for(r["moisture"]))}"
        end
        if points.size == 1
          x, y = points[0].split(",")
          out << "<circle cx='#{x}' cy='#{y}' r='3' fill='#2f7d4f'/>"
        elsif points.size > 1
          out << "<polyline points='#{points.join(" ")}' fill='none' stroke='#2f7d4f' stroke-width='2' stroke-linejoin='round'/>"
        end
        out << "</svg>"
        out
      end

      def self.data_uri(readings, now_ms)
        body = svg(readings, now_ms).gsub("%", "%25").gsub("#", "%23")
                                     .gsub("<", "%3C").gsub(">", "%3E")
        "data:image/svg+xml;charset=utf-8,#{body}"
      end
    end

    class DeviceCard < Funicular::Component
      def render
        reading = props[:reading]
        status = reading["status"]
        volt = (reading["volt"] * 100).round / 100.0
        div(class: "card #{status}") do
          div(class: "head") do
            span(class: "device") { reading["device"] }
            span(class: "updated") { "最終更新 #{Clock.local(reading["measured_at"])}" }
          end
          div(class: "now") do
            div(class: "moisture") do
              span { reading["moisture"].to_s }
              tag(:small) { "%" }
            end
            span(class: "badge #{status}") { "#{STATUS_LABELS[status]}（#{status}）" }
            span(class: "meta") { "#{volt} V / raw #{reading["raw"]}" }
          end
          h2(class: "chart-title") { "過去24時間の水分量（%）" }
          img(class: "chart", alt: "#{reading["device"]} の過去24時間の水分量グラフ",
              src: MoistureChart.data_uri(props[:history] || [], props[:now_ms]))
        end
      end
    end

    class PlanterDashboard < Funicular::Component
      def initialize_state
        { latest: [], history: {}, loading: true, error: nil, now_ms: Clock.now_ms }
      end

      def component_mounted
        @alive = true
        refresh
      end

      def component_unmounted
        @alive = false
        JS.global.clearTimeout(@timer) if @timer
      end

      def refresh
        Funicular::HTTP.get("/api/latest") do |response|
          next unless @alive
          if response.error?
            patch(loading: false, error: "読み込めませんでした: #{response.error_message || response.status}")
          else
            latest = response.data
            patch(latest: latest, loading: false, error: nil, now_ms: Clock.now_ms)
            latest.each { |reading| load_history(reading["device"]) }
          end
          schedule
        end
      end

      def load_history(device)
        Funicular::HTTP.get("/api/readings?device=#{device}&limit=288") do |response|
          if @alive && !response.error?
            patch(history: state[:history].merge(device => response.data))
          end
        end
      end

      def schedule
        JS.global.clearTimeout(@timer) if @timer
        @timer = JS.global.setTimeout(POLL_MS) { refresh if @alive }
      end

      def render
        tag(:main) do
          h1 { "スマートプランター" }
          div(class: "lead") { "土の水分量を 60 秒ごとに更新しています。" }
          if state[:error]
            div(class: "notice error") { state[:error] }
          end
          if state[:loading]
            div(class: "notice") { "読み込み中…" }
          elsif state[:latest].empty?
            div(class: "notice") { "まだ測定値がありません。センサーからの送信を待っています。" }
          end
          state[:latest].each do |reading|
            component(DeviceCard, key: reading["device"], reading: reading,
                      history: state[:history][reading["device"]], now_ms: state[:now_ms])
          end
          footer { "PicoRuby on Cloudflare Workers + D1 / Funicular" }
        end
      end
    end

    Funicular.start(PlanterDashboard, container: "app")
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@picoruby/wasm-wasi@4.0.5/dist/init.iife.js"></script>
</body>
</html>
