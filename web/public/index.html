<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <link rel="icon" href="data:,">
  <title>スマートプランター</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f3ee;
      --surface: #ffffff;
      --line: #dedad0;
      --text: #1d2420;
      --muted: #5f6964;
      --dry: #b45309;
      --dry-soft: #fdf0dd;
      --ok: #2f7d4f;
      --ok-soft: #e3f3e8;
      --wet: #1d6fb8;
      --wet-soft: #e1eefa;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141816;
        --surface: #1d2320;
        --line: #333b37;
        --text: #e8ece9;
        --muted: #a3ada8;
        --dry: #f0a04b;
        --dry-soft: #3a2a17;
        --ok: #5cc28a;
        --ok-soft: #183526;
        --wet: #63a9ec;
        --wet-soft: #162c42;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
    /* Mobile first: one column, 16px sides, clear of the notch and home indicator. */
    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }
    h1 { margin: 0; font-size: 1.4rem; }
    .lead { margin: 4px 0 16px; color: var(--muted); font-size: 15px; }
    .notice { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 15px; }
    .notice.error { color: var(--dry); border-color: var(--dry); }
    .card { margin-bottom: 16px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--line); }
    .card.dry { border-top-color: var(--dry); }
    .card.ok { border-top-color: var(--ok); }
    .card.wet { border-top-color: var(--wet); }
    .plant { display: flex; align-items: center; gap: 14px; }
    .photo { flex: none; width: 64px; height: 96px; border-radius: 12px; object-fit: cover; }
    .plant-text { min-width: 0; }
    .nickname { font-size: 1.6rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
    .species { margin-top: 2px; color: var(--muted); font-size: 15px; }
    .species i { margin-left: 6px; }
    .moisture { margin: 16px 0 8px; font-size: 4.5rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .moisture small { font-size: 1.75rem; font-weight: 600; margin-left: 4px; }
    .badge { display: inline-block; padding: 8px 16px; border-radius: 999px; font-size: 1.05rem; font-weight: 700; }
    .badge.dry { color: var(--dry); background: var(--dry-soft); }
    .badge.ok { color: var(--ok); background: var(--ok-soft); }
    .badge.wet { color: var(--wet); background: var(--wet-soft); }
    .range { margin-top: 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
    .meta { margin-top: 6px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
    .chart-title { margin: 18px 0 6px; font-size: 15px; color: var(--muted); font-weight: 500; }
    .chart { display: block; width: 100%; height: auto; }
    footer { color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/ruby">
    # Ruby in the browser: Funicular 0.5.2 bundled in @picoruby/wasm-wasi 4.0.5.

    POLL_MS = 60_000
    DAY_MS = 24 * 60 * 60 * 1000
    STATUS_LABELS = { "dry" => "乾燥", "ok" => "ちょうどよい", "wet" => "湿りすぎ" }
    # Used when a device has no plant profile (same as the server).
    DEFAULT_RANGE = { "moisture_min" => 30, "moisture_max" => 59 }

    module Clock
      def self.now_ms
        JS.global[:Date].now.to_i
      end

      def self.parse_ms(iso)
        JS.global[:Date].parse(iso).to_i
      end

      def self.local(iso)
        JS.global[:Date].new(iso).toLocaleString("ja-JP")
      end
    end

    # Moisture over the last 24 hours, drawn as an SVG polyline in Ruby.
    # Funicular's virtual DOM creates HTML elements only, so the SVG is
    # handed to an <img> as a data URI. The size suits a phone screen.
    module MoistureChart
      W = 340
      H = 210
      LEFT = 30
      RIGHT = 6
      TOP = 10
      BOTTOM = 28

      def self.x_for(ms, start_ms)
        LEFT + (ms - start_ms) * (W - LEFT - RIGHT) / DAY_MS.to_f
      end

      def self.y_for(moisture)
        TOP + (100 - moisture) * (H - TOP - BOTTOM) / 100.0
      end

      def self.r1(v)
        (v * 10).round / 10.0
      end

      def self.svg(readings, now_ms, range)
        start_ms = now_ms - DAY_MS
        plot_w = W - LEFT - RIGHT
        min = range["moisture_min"]
        max = range["moisture_max"]
        out = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 #{W} #{H}' font-family='system-ui, sans-serif' font-size='14'>"
        # Bands for dry, ok and wet, from the plant's optimal range.
        [[0, min, "#b45309"], [min, max + 1, "#2f7d4f"], [max + 1, 100, "#1d6fb8"]].each do |lo, hi, color|
          y = y_for(hi)
          out << "<rect x='#{LEFT}' y='#{r1(y)}' width='#{plot_w}' height='#{r1(y_for(lo) - y)}' fill='#{color}' fill-opacity='0.1'/>"
        end
        [0, min, max + 1, 100].each do |v|
          y = r1(y_for(v))
          out << "<line x1='#{LEFT}' x2='#{W - RIGHT}' y1='#{y}' y2='#{y}' stroke='#8a948f' stroke-opacity='0.35'/>"
          out << "<text x='#{LEFT - 5}' y='#{r1(y + 5)}' text-anchor='end' fill='#8a948f'>#{v}</text>"
        end
        [[0, "24時間前"], [12, "12時間前"], [24, "いま"]].each do |hour, label|
          x = r1(LEFT + plot_w * hour / 24.0)
          anchor = hour == 0 ? "start" : (hour == 24 ? "end" : "middle")
          out << "<text x='#{x}' y='#{H - 8}' text-anchor='#{anchor}' fill='#8a948f'>#{label}</text>"
        end
        points = []
        readings.reverse.each do |r|
          ms = Clock.parse_ms(r["measured_at"])
          next if ms < start_ms
          points << "#{r1(x_for(ms, start_ms))},#{r1(y_for(r["moisture"]))}"
        end
        if points.size == 1
          x, y = points[0].split(",")
          out << "<circle cx='#{x}' cy='#{y}' r='3' fill='#2f7d4f'/>"
        elsif points.size > 1
          out << "<polyline points='#{points.join(" ")}' fill='none' stroke='#2f7d4f' stroke-width='2.5' stroke-linejoin='round'/>"
        end
        out << "</svg>"
        out
      end

      def self.data_uri(readings, now_ms, range)
        body = svg(readings, now_ms, range).gsub("%", "%25").gsub("#", "%23")
                                            .gsub("<", "%3C").gsub(">", "%3E")
        "data:image/svg+xml;charset=utf-8,#{body}"
      end
    end

    class DeviceCard < Funicular::Component
      def render
        reading = props[:reading]
        plant = reading["plant"]          # nil when the device has no profile
        range = plant || DEFAULT_RANGE
        status = reading["status"]
        volt = (reading["volt"] * 100).round / 100.0
        div(class: "card #{status}") do
          div(class: "plant") do
            if plant && plant["photo_url"]
              img(class: "photo", src: plant["photo_url"], alt: plant["species"])
            end
            div(class: "plant-text") do
              div(class: "nickname") { plant ? plant["nickname"] : reading["device"] }
              if plant
                div(class: "species") do
                  span { plant["species"] }
                  tag(:i) { plant["scientific_name"] } if plant["scientific_name"]
                end
              end
            end
          end
          div(class: "moisture") do
            span { reading["moisture"].to_s }
            tag(:small) { "%" }
          end
          span(class: "badge #{status}") { "#{STATUS_LABELS[status]}（#{status}）" }
          div(class: "range") { "ちょうどよい水分量 #{range["moisture_min"]}〜#{range["moisture_max"]}%" }
          div(class: "meta") { "最終更新 #{Clock.local(reading["measured_at"])}" }
          div(class: "meta") { "#{reading["device"]} / #{volt} V / raw #{reading["raw"]}" }
          h2(class: "chart-title") { "過去24時間の水分量（%）" }
          img(class: "chart", alt: "過去24時間の水分量グラフ",
              src: MoistureChart.data_uri(props[:history] || [], props[:now_ms], range))
        end
      end
    end

    class PlanterDashboard < Funicular::Component
      def initialize_state
        { latest: [], history: {}, loading: true, error: nil, now_ms: Clock.now_ms }
      end

      def component_mounted
        @alive = true
        refresh
      end

      def component_unmounted
        @alive = false
        JS.global.clearTimeout(@timer) if @timer
      end

      def refresh
        Funicular::HTTP.get("/api/latest") do |response|
          next unless @alive
          if response.error?
            patch(loading: false, error: "読み込めませんでした: #{response.error_message || response.status}")
          else
            latest = response.data
            patch(latest: latest, loading: false, error: nil, now_ms: Clock.now_ms)
            latest.each { |reading| load_history(reading["device"]) }
          end
          schedule
        end
      end

      def load_history(device)
        Funicular::HTTP.get("/api/readings?device=#{device}&limit=288") do |response|
          if @alive && !response.error?
            patch(history: state[:history].merge(device => response.data))
          end
        end
      end

      def schedule
        JS.global.clearTimeout(@timer) if @timer
        @timer = JS.global.setTimeout(POLL_MS) { refresh if @alive }
      end

      def render
        tag(:main) do
          h1 { "スマートプランター" }
          div(class: "lead") { "土の水分量を 60 秒ごとに更新しています。" }
          if state[:error]
            div(class: "notice error") { state[:error] }
          end
          if state[:loading]
            div(class: "notice") { "読み込み中…" }
          elsif state[:latest].empty?
            div(class: "notice") { "まだ測定値がありません。センサーからの送信を待っています。" }
          end
          state[:latest].each do |reading|
            component(DeviceCard, key: reading["device"], reading: reading,
                      history: state[:history][reading["device"]], now_ms: state[:now_ms])
          end
          footer { "PicoRuby on Cloudflare Workers + D1 / Funicular" }
        end
      end
    end

    Funicular.start(PlanterDashboard, container: "app")
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@picoruby/wasm-wasi@4.0.5/dist/init.iife.js"></script>
</body>
</html>
